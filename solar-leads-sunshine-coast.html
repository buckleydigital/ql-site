class P{constructor(){this.reset(true)}reset(init){this.x=Math.random()*W();this.y=init?Math.random()*H():H()+10;this.r=Math.random()*1.6+.3;this.vx=(Math.random()-.5)*.2;this.vy=-(Math.random()*.35+.08);this.a=Math.random()*.35+.05;this.life=0;this.maxL=Math.random()*450+200;this.c=Math.random()>.5?'#4797FF':Math.random()>.5?'#7CB9FF':'#B8D4FF';this.glow=this.r>1.2}draw(){const t=this.life/this.maxL;const fade=t<.1?t/.1:t>.8?(1-t)/.2:1;ctx.save();ctx.globalAlpha=this.a*fade;if(this.glow){ctx.shadowBlur=this.r*5;ctx.shadowColor=this.c}ctx.fillStyle=this.c;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();ctx.restore()}update(){this.x+=this.vx;this.y+=this.vy;this.life++;if(this.life>this.maxL||this.y<-20)this.reset()}}
const pts=Array.from({length:80},()=>new P());
function animP(){ctx.clearRect(0,0,W(),H());pts.forEach(p=>{p.update();p.draw()});requestAnimationFrame(animP)}
animP();
const cur=document.getElementById('cur'),curR=document.getElementById('curR'),aura=document.getElementById('aura');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cur.style.left=mx+'px';cur.style.top=my+'px';aura.style.left=mx+'px';aura.style.top=my+'px'});
(function aR(){rx+=(mx-rx)*.1;ry+=(my-ry)*.1;curR.style.left=rx+'px';curR.style.top=ry+'px';requestAnimationFrame(aR)})();
document.querySelectorAll('a,button,.stat,.tc').forEach(el=>{el.addEventListener('mouseenter',()=>document.body.classList.add('hov'));el.addEventListener('mouseleave',()=>document.body.classList.remove('hov'))});
document.querySelectorAll('.btn-mag').forEach(btn=>{btn.addEventListener('mousemove',e=>{const r=btn.getBoundingClientRect();btn.style.setProperty('--bx',((e.clientX-r.left)/r.width*100)+'%');btn.style.setProperty('--by',((e.clientY-r.top)/r.height*100)+'%')})});
const hdr=document.getElementById('siteHeader');
window.addEventListener('scroll',()=>hdr.classList.toggle('sc',window.scrollY>20));
const sp=document.getElementById('scrollProg');
window.addEventListener('scroll',()=>{const d=document.documentElement;sp.style.transform='scaleX('+(d.scrollTop/(d.scrollHeight-d.clientHeight))+')'},{passive:true});
const rvEls=document.querySelectorAll('.rv');
const ro=new IntersectionObserver(ents=>{ents.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');ro.unobserve(e.target)}})},{threshold:.1});
rvEls.forEach(el=>ro.observe(el));
function countUp(el){const t=parseInt(el.dataset.t),s=el.dataset.s||'',d=1800,t0=performance.now();function step(now){const p=Math.min((now-t0)/d,1),e=1-Math.pow(1-p,3);el.textContent=Math.floor(e*t)+s;if(p<1)requestAnimationFrame(step);else{el.textContent=t+s;el.classList.add('lit')}}requestAnimationFrame(step)}
const statEls=document.querySelectorAll('.stn[data-t]');
const so=new IntersectionObserver(ents=>{ents.forEach(e=>{if(e.isIntersecting){countUp(e.target);so.unobserve(e.target)}})},{threshold:.5});
statEls.forEach(el=>so.observe(el));
const cards=[...document.querySelectorAll('.tc')];
const dots=[...document.querySelectorAll('.car-dot')];
let curI=0,autoT;
function setCarousel(idx){curI=((idx%cards.length)+cards.length)%cards.length;cards.forEach((c,i)=>{c.classList.remove('pos-center','pos-left','pos-right','pos-hidden');const rel=(i-curI+cards.length)%cards.length;if(rel===0)c.classList.add('pos-center');else if(rel===1)c.classList.add('pos-right');else if(rel===cards.length-1)c.classList.add('pos-left');else c.classList.add('pos-hidden')});dots.forEach((d,i)=>d.classList.toggle('a',i===curI))}
setCarousel(0);
document.getElementById('carNext').addEventListener('click',()=>{setCarousel(curI+1);clearInterval(autoT);startAuto()});
document.getElementById('carPrev').addEventListener('click',()=>{setCarousel(curI-1);clearInterval(autoT);startAuto()});
dots.forEach((d,i)=>d.addEventListener('click',()=>{setCarousel(i);clearInterval(autoT);startAuto()}));
function startAuto(){autoT=setInterval(()=>setCarousel(curI+1),4500)}
startAuto();
let tx=0;const cs=document.querySelector('.car-scene');
if(cs){cs.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});cs.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>40){setCarousel(dx<0?curI+1:curI-1);clearInterval(autoT);startAuto()}},{passive:true})}
const mobBtn=document.getElementById('mobBtn'),mobMenu=document.getElementById('mobMenu');
if(mobBtn&&mobMenu){mobBtn.addEventListener('click',()=>mobMenu.classList.toggle('open'));mobMenu.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>mobMenu.classList.remove('open')))}
function toggleFaq(btn){const item=btn.parentElement,isOpen=item.classList.contains('open');document.querySelectorAll('.faq-item').forEach(i=>i.classList.remove('open'));if(!isOpen)item.classList.add('open')}
</script>
</body>
</html>
