    <style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; font-size: 16px; overflow-x: hidden; }

:root {
    --bg: #04040A;
    --bg-lift: #08080F;
    --bg-card: #0C0C18;
    --bg-deep: #08080F;
    --border: rgba(255,255,255,0.07);
    --border-mid: rgba(255,255,255,0.10);
    --ink: #F2F2F2;
    --ink-soft: #CACAD0;
    --ink-muted: #71717A;
    --ink-faint: #3F3F46;
    --accent: #4797FF;
    --accent-dim: rgba(71,151,255,0.12);
    --accent-glow: rgba(71,151,255,0.04);
    --button-primary: #4797FF;
    --sky: #7CB9FF;
    --mist: #B8D4FF;
    --display:'General Sans','PP Neue Montreal','Neue Montreal',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
}

body {
    font-family: var(--body);
    font-feature-settings: "cv11", "ss01", "ss03";
    background: var(--bg);
    color: var(--ink);
    line-height: 1.65;
    font-weight: 400;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4, h5, h6 { font-weight: 600; font-family: var(--display); }

.hero {
    padding: 160px 48px 80px;
    position: relative; overflow: hidden;
    border-bottom: 1px solid var(--border);
}
.hero-glow { display: none; }
.hero-grid { display: none; }
.hero-inner { max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }

.eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 11px; font-weight: 400; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 28px;
}
.eyebrow::before { content: ''; width: 20px; height: 1px; background: var(--accent); }

.hero h1 {
    font-family: var(--display);
    font-size: clamp(2rem, 7vw, 4.2rem); line-height: 1.08;
    letter-spacing: -0.025em; color: var(--ink); margin-bottom: 28px;
    max-width: 780px;
}
.hero h1 em { font-style: normal; font-weight: 600; background: linear-gradient(90deg, #B8D4FF, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

.hero-sub {
    font-size: 1.04rem; font-weight: 400; color: var(--ink-muted);
    line-height: 1.74; max-width: 600px; margin-bottom: 40px;
}

.article-meta {
    display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
    font-size: 13px; color: var(--ink-faint);
    padding-top: 32px; border-top: 1px solid var(--border);
}
.article-meta-tag {
    background: var(--accent-dim); color: var(--accent);
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 3px 10px; border-radius: 3px;
}

.si { max-width: 900px; margin: 0 auto; }
.slbl {
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 16px;
    display: flex; align-items: center; gap: 10px;
}
.slbl::before { content: ''; width: 20px; height: 1px; background: var(--accent); opacity: 0.5; }
.stitle {
    font-family: var(--display); font-size: clamp(2rem, 3.4vw, 2.8rem); font-weight: 600;
    line-height: 1.1; letter-spacing: -0.02em; color: var(--ink); margin-bottom: 20px;
}
.stitle em { font-style: normal; font-weight: 600; background: linear-gradient(90deg, #B8D4FF, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

.content-section { padding: 80px 48px; border-bottom: 1px solid var(--border); }
.content-section.lifted { background: var(--bg-lift); }

.prose {
    font-size: .95rem; font-weight: 400; color: var(--ink-muted);
    line-height: 1.85; max-width: 680px; margin-top: 36px;
}
.prose p + p { margin-top: 22px; }
.prose strong { color: var(--ink); font-weight: 400; }
.prose a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; transition: color 0.2s; }
.prose a:hover { color: var(--ink); }
.prose h3 {
    font-family: var(--display); font-size: clamp(1.3rem,2.2vw,1.75rem); color: var(--ink);
    line-height: 1.2; letter-spacing: -0.015em;
    margin-top: 48px; margin-bottom: 16px;
}
.prose h3 em { font-style: normal; font-weight: 600; background: linear-gradient(90deg, #B8D4FF, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.prose ul, .prose ol { margin-top: 16px; margin-bottom: 16px; padding-left: 24px; }
.prose li { margin-bottom: 8px; }

.callout {
    background: var(--bg-card); border: 1px solid var(--border-mid);
    border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0; padding: 28px 32px;
    margin: 40px 0;
}
.callout-lbl {
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 12px;
}
.callout p { font-size: 15px; color: var(--ink-soft); line-height: 1.75; font-weight: 400; margin: 0; }
.callout p + p { margin-top: 12px; }
.callout p strong { color: var(--ink); font-weight: 400; }

.related-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 1px; background: var(--border);
    border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
    margin-top: 48px;
}
.related-card { padding: 32px 24px; text-decoration: none; display: block; transition: all 0.3s; background: var(--bg-card); }
.related-card:hover { background: var(--bg-lift); }
.related-tag {
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--accent); background: var(--accent-dim);
    padding: 3px 10px; border-radius: 3px; display: inline-block; margin-bottom: 16px;
}
.related-title {
    font-family: var(--display); font-size: 18px; font-weight: 600; color: var(--ink);
    line-height: 1.3; margin-bottom: 10px;
}
.related-title em { font-style: normal; font-weight: 600; background: linear-gradient(90deg, #B8D4FF, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.related-desc { font-size: 13px; color: var(--ink-muted); line-height: 1.6; font-weight: 400; }

.site-header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 200;
    padding: 0 5%;
    background: rgba(4,4,10,0);
    border-bottom: 1px solid transparent;
    transition: background 0.4s, border-color 0.4s, backdrop-filter 0.4s;
}
.site-header.sc {
    background: rgba(4,4,10,0.92);
    backdrop-filter: blur(28px);
    border-bottom-color: var(--border);
}
.header-inner {
    max-width: 1120px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    height: 68px;
}
.logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.nav-links { display: flex; align-items: center; gap: 28px; list-style: none; }
.nav-links > a,
.nav-links li a {
    font-family: var(--body); font-size: 0.84rem; font-weight: 400; color: var(--ink-muted);
    text-decoration: none; letter-spacing: 0.02em; background: none; border: none;
    display: flex; align-items: center; gap: 4px; padding: 0; transition: color 0.2s;
}
.nav-links > a:hover, .nav-links li a:hover { color: var(--ink); }
.nav-cta{
    background:linear-gradient(180deg,#6FADFF 0%,#4797FF 46%,#2F82F0 100%) !important; color: #fff !important;
    padding: 9px 22px !important; border-radius: 100px !important;
    font-family: var(--body) !important; font-size: 0.84rem !important; font-weight: 500 !important;
    transition: all 0.2s !important; text-decoration: none !important;box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -6px 12px rgba(0,0,0,.12),0 4px 14px rgba(71,151,255,.30),0 0 0 4px rgba(71,151,255,.09);border:1px solid rgba(255,255,255,.16);font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -6px 12px rgba(0,0,0,.12),0 4px 14px rgba(71,151,255,.30),0 0 0 4px rgba(71,151,255,.09) !important;border:1px solid rgba(255,255,255,.16) !important;font-weight:600 !important;}
.nav-cta:hover { background: var(--sky) !important; transform: translateY(-1px); box-shadow: 0 8px 28px rgba(71,151,255,0.4); }
.mob-btn { display: none; background: none; border: none; cursor: pointer; padding: 4px; flex-direction: column; gap: 5px; }
.mob-btn span { display: block; width: 22px; height: 1.5px; background: var(--ink); transition: 0.3s; }
.mob-menu {
    display: none; position: absolute; top: 100%; left: 0; right: 0;
    background: rgba(4,4,10,0.97); border-bottom: 1px solid var(--border); padding: 0 5% 20px;
    backdrop-filter: blur(28px);
}
.mob-menu.open { display: flex; flex-direction: column; gap: 0; }
.mob-menu a { padding: 14px 0; font-size: 16px; color: var(--ink-soft); text-decoration: none; border-bottom: 1px solid var(--border); }
.mob-menu a:hover { color: var(--ink); }
.mob-cta-link{ background:linear-gradient(180deg,#6FADFF 0%,#4797FF 46%,#2F82F0 100%) !important; color: #fff !important; padding: 14px 0 !important; border-radius: 100px; text-align: center; margin-top: 12px; border-bottom: none !important;box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -6px 12px rgba(0,0,0,.12),0 4px 14px rgba(71,151,255,.30),0 0 0 4px rgba(71,151,255,.09);border:1px solid rgba(255,255,255,.16);font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -6px 12px rgba(0,0,0,.12),0 4px 14px rgba(71,151,255,.30),0 0 0 4px rgba(71,151,255,.09) !important;border:1px solid rgba(255,255,255,.16) !important;font-weight:600 !important;}

.cta-section { padding: 100px 48px; text-align: center; position: relative; overflow: hidden; }
.cta-inner { max-width: 700px; margin: 0 auto; position: relative; z-index: 1; }
.cta-inner h2 { font-family: var(--display); font-size: clamp(28px, 4vw, 46px); font-weight:600; line-height: 1.1; color: var(--ink); margin-bottom: 20px; letter-spacing: -0.4px; }
.cta-inner h2 em { font-style: normal; color: var(--button-primary); font-weight:600; }
.cta-inner p { font-size: 16px; color: var(--ink-muted); line-height: 1.75; margin-bottom: 40px; font-weight: 400; }
.cta-btns { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.btn-primary {
            background: linear-gradient(180deg,#6FADFF 0%,#4797FF 46%,#2F82F0 100%); color: #fff;
            padding: 16px 38px; border-radius: 100px; text-decoration: none;
            font-family: var(--body); font-size: .9rem; font-weight: 600; letter-spacing: 0.01em;
            display: inline-block; border: 1px solid rgba(255,255,255,.16);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.42), inset 0 -10px 20px rgba(0,0,0,.14),
                        0 8px 22px rgba(71,151,255,.34), 0 0 0 6px rgba(71,151,255,.10), 0 0 34px rgba(71,151,255,.20);
            transition: transform .22s, box-shadow .3s, filter .22s;
        })();
(function(){
const cur=document.getElementById('cur'),curR=document.getElementById('curR'),aura=document.getElementById('aura');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cur.style.left=mx+'px';cur.style.top=my+'px';aura.style.left=mx+'px';aura.style.top=my+'px'});
(function aR(){rx+=(mx-rx)*.1;ry+=(my-ry)*.1;curR.style.left=rx+'px';curR.style.top=ry+'px';requestAnimationFrame(aR)})();
document.querySelectorAll('a,button').forEach(el=>{el.addEventListener('mouseenter',()=>document.body.classList.add('hov'));el.addEventListener('mouseleave',()=>document.body.classList.remove('hov'));});
})();
(function(){const sp=document.getElementById('scrollProg');window.addEventListener('scroll',()=>{const d=document.documentElement;sp.style.transform='scaleX('+(d.scrollTop/(d.scrollHeight-d.clientHeight))+')'},{passive:true});})();
(function(){const rvEls=document.querySelectorAll('.rv');const ro=new IntersectionObserver(ents=>{ents.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');ro.unobserve(e.target)}})},{threshold:.1});rvEls.forEach(el=>ro.observe(el));})();
</script>
