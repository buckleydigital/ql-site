<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sydney Roofing Ad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@700;800;900&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Roofing ad: photo-led, logo top centre, two-tone headline, white footer
     strip with rating, two selling points and the button. The photo is
     roofing-ad-img.jpg in the site root; until it exists, a sky gradient. */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --blue: #4797FF; --blue-d: #2F7FEA; --ink: #16181D; --mute: #4B5160; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; font-family: 'Poppins', sans-serif; background: #8fc3f5; }

  .ad { position: relative; width: 1080px; height: 1080px; display: flex; flex-direction: column; overflow: hidden; }

  .photo {
    position: absolute; inset: 0 0 150px 0;
    background:
      url('../roofing-ad-img.jpg') center 60% / cover no-repeat,
      linear-gradient(180deg, #3f95ec 0%, #79b9f5 45%, #a9d3fa 70%, #6f8aa6 100%);
  }
  /* Darken the top a little so the white headline always reads. */
  .photo::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(8,24,52,.38) 0%, rgba(8,24,52,.12) 38%, rgba(8,24,52,0) 60%);
  }

  .top { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 54px; }

  .logo { display: flex; align-items: center; gap: 14px; }
  .logo-icon { width: 62px; height: 62px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  .logo-icon svg { width: 34px; height: 34px; fill: none; stroke: var(--blue); stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
  .logo-text { text-align: left; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.35); }
  .logo-name { font-family: 'Exo 2', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: .02em; line-height: 1; text-transform: uppercase; }
  .logo-sub { font-size: 14px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; opacity: .9; margin-top: 5px; }

  .headline {
    margin-top: 44px;
    font-family: 'Exo 2', sans-serif; font-weight: 900; font-size: 128px; line-height: .95;
    letter-spacing: -.01em; text-transform: uppercase; color: #fff;
    text-shadow: 0 6px 0 rgba(10,30,60,.35), 0 10px 40px rgba(0,0,0,.35);
  }
  .headline span { color: #fff; }

  .sub {
    margin-top: 34px; max-width: 760px;
    font-size: 36px; font-weight: 700; line-height: 1.25; color: #fff;
    text-shadow: 0 3px 16px rgba(0,0,0,.45);
  }

  .strip {
    position: absolute; left: 0; right: 0; bottom: 0; height: 150px; z-index: 3;
    background: #fff; display: flex; align-items: center; justify-content: space-between; gap: 26px; padding: 0 48px;
    box-shadow: 0 -10px 30px rgba(0,0,0,.12);
  }
  .rating { display: flex; flex-direction: column; align-items: flex-start; }
  .rating-score { font-family: 'Exo 2', sans-serif; font-weight: 800; font-size: 40px; color: var(--ink); line-height: 1; }
  .rating-stars { color: #F5A623; font-size: 26px; letter-spacing: 3px; line-height: 1.1; }
  .rating-src { font-size: 15px; font-weight: 600; color: var(--mute); }

  .point { display: flex; align-items: center; gap: 14px; }
  .point svg { width: 40px; height: 40px; fill: var(--blue); flex-shrink: 0; }
  .point div { font-size: 22px; font-weight: 700; color: var(--ink); line-height: 1.2; }

  .cta {
    font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: .01em; text-transform: uppercase;
    color: #fff; background: var(--blue); padding: 26px 36px; border-radius: 18px; white-space: nowrap;
    box-shadow: 0 10px 0 var(--blue-d), 0 16px 30px rgba(71,151,255,.35);
  }
</style>
</head>
<body>
<div class="ad">
  <div class="photo"></div>

  <div class="top">
    <div class="logo">
      <div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.6V20h13V9.6"/><path d="M10 20v-5h4v5"/></svg></div>
      <div class="logo-text">
        <div class="logo-name">Sydney Roofing Co.</div>
        <div class="logo-sub">Restorations · Repairs</div>
      </div>
    </div>
    <div class="headline">Roof <span>Restoration</span></div>
    <div class="sub">Add value to your home with a professional roof restoration.</div>
  </div>

  <div class="strip">
    <div class="rating">
      <div class="rating-score">4.9</div>
      <div class="rating-stars">★★★★★</div>
      <div class="rating-src">Google reviews</div>
    </div>
    <div class="point">
      <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
      <div>Sydney<br>Roofers</div>
    </div>
    <div class="point">
      <svg viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5l-8-3zm-1.2 14.2-3.5-3.5 1.4-1.4 2.1 2.1 4.9-4.9 1.4 1.4-6.3 6.3z"/></svg>
      <div>10-Year<br>Warranty</div>
    </div>
    <div class="cta">Get Quote Now</div>
  </div>
</div>
</body>
</html>
