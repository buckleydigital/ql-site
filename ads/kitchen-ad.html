<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sydney Kitchens Co. Ad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  /* Example Meta ad, 1080 x 1080, for the made-up Sydney Kitchens Co.
     Three colours: Forest (the deep base), Linen (the warm neutral) and Sage
     (the accent). The top is the kitchen photo (kitchen-au.png); until that
     file exists it falls back to a drawn kitchen, so the ad never looks broken. */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --forest: #18201B; --forest2: #24302A; --linen: #F3EFE6; --sage: #7FA684; --sage-lt: #B9D3B2; --sage-dk: #4E6F54; --oak: #B98B5E; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
  .ad { position: relative; width: 1080px; height: 1080px; overflow: hidden; background: var(--forest); }

  .room { position: absolute; left: 0; right: 0; top: 0; height: 650px; overflow: hidden; }
  .drawn { position: absolute; inset: 0; }
  .photo { position: absolute; inset: 0; background: url('../kitchen-au.png') center / cover no-repeat; filter: saturate(.85) brightness(.6) contrast(1.08); }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(24,32,27,.8) 0%, rgba(24,32,27,.1) 26%, rgba(24,32,27,0) 62%, rgba(24,32,27,.75) 100%); }

  .top { position: absolute; left: 56px; right: 56px; top: 48px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
  .logo { display: flex; align-items: center; gap: 14px; font-weight: 600; font-size: 27px; color: var(--linen); letter-spacing: -.01em; }
  .logo svg { width: 36px; height: 36px; fill: none; stroke: var(--sage-lt); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .rate { padding: 10px 18px; border-radius: 18px; background: rgba(243,239,230,.1); border: 1px solid rgba(243,239,230,.22); backdrop-filter: blur(8px); text-align: right; color: var(--linen); }
  .rate b { display: block; font: 400 30px 'Instrument Serif'; line-height: 1; }
  .rate span { font-size: 14px; color: rgba(243,239,230,.72); }

  .panel { position: absolute; left: 0; right: 0; bottom: 0; height: 440px; background: linear-gradient(180deg, #F7F4EC 0%, var(--linen) 100%); padding: 40px 60px 0; }
  .panel::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--sage) 20%, var(--sage-lt) 50%, var(--sage) 80%, transparent); }
  .kicker { display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--sage-dk); }
  .kicker::before { content: ''; width: 34px; height: 1.5px; background: var(--sage); }
  h1 { margin-top: 16px; font-weight: 500; font-size: 74px; line-height: 1.0; letter-spacing: -.04em; color: var(--forest); }
  h1 em { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; font-size: 86px; letter-spacing: -.01em; color: var(--sage-dk); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 28px; margin-top: 24px; }
  .sub { font-size: 22px; line-height: 1.45; color: #545B52; max-width: 520px; }
  .btn { display: inline-flex; align-items: center; gap: 12px; flex-shrink: 0; padding: 20px 32px; border-radius: 100px; background: var(--forest); color: var(--linen); font-size: 22px; font-weight: 600; box-shadow: 0 16px 34px -14px rgba(24,32,27,.6); }
  .btn svg { width: 22px; height: 22px; fill: none; stroke: var(--sage-lt); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .trio { position: absolute; left: 60px; right: 60px; bottom: 34px; display: flex; gap: 30px; padding-top: 18px; border-top: 1px solid rgba(78,111,84,.25); font-size: 16px; font-weight: 500; letter-spacing: .02em; color: #5F665C; }
  .trio span { display: inline-flex; align-items: center; gap: 10px; }
  .trio span::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--sage); }
</style>
</head>
<body>
<div class="ad">
  <div class="room">
    <!-- drawn fallback: pendant lights over an island, upper cabinets, oak benchtop -->
    <svg class="drawn" viewBox="0 0 1080 650" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B3A31"/><stop offset="1" stop-color="#1D2822"/></linearGradient>
        <linearGradient id="oak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D2A577"/><stop offset="1" stop-color="#9C7148"/></linearGradient>
        <radialGradient id="glow"><stop offset="0" stop-color="#FFE3B0" stop-opacity=".55"/><stop offset="1" stop-color="#FFE3B0" stop-opacity="0"/></radialGradient>
      </defs>
      <rect width="1080" height="650" fill="url(#wall)"/>
      <g fill="#33453A" stroke="#3E5446" stroke-width="2">
        <rect x="90" y="150" width="200" height="170" rx="6"/><rect x="300" y="150" width="200" height="170" rx="6"/>
        <rect x="580" y="150" width="200" height="170" rx="6"/><rect x="790" y="150" width="200" height="170" rx="6"/>
      </g>
      <g stroke="#7FA684" stroke-width="4" stroke-linecap="round"><path d="M270 230v30M480 230v30M600 230v30M810 230v30"/></g>
      <rect x="0" y="372" width="1080" height="26" fill="#C9C3B6"/>
      <g fill="#E9E4D8" opacity=".5"><rect x="90" y="335" width="900" height="37"/></g>
      <rect x="160" y="470" width="760" height="30" rx="6" fill="url(#oak)"/>
      <rect x="180" y="500" width="720" height="150" fill="#2C3B32"/>
      <g stroke="#3E5446" stroke-width="2"><path d="M360 500v150M540 500v150M720 500v150"/></g>
      <g><path d="M380 0v90M540 0v90M700 0v90" stroke="#9AA697" stroke-width="2"/>
        <g fill="#E8D9B8"><path d="M350 90h60l-12 34h-36z"/><path d="M510 90h60l-12 34h-36z"/><path d="M670 90h60l-12 34h-36z"/></g>
        <circle cx="380" cy="150" r="120" fill="url(#glow)"/><circle cx="540" cy="150" r="120" fill="url(#glow)"/><circle cx="700" cy="150" r="120" fill="url(#glow)"/></g>
      <g fill="#7FA684" opacity=".9"><circle cx="830" cy="452" r="16"/><circle cx="848" cy="440" r="12"/><rect x="822" y="452" width="22" height="20" rx="4" fill="#E9E4D8"/></g>
    </svg>
    <div class="photo"></div><div class="shade"></div>
    <div class="top">
      <div class="logo"><svg viewBox="0 0 24 24"><rect x="3" y="12" width="18" height="9" rx="1.5"/><path d="M3 15h18"/><path d="M7 12V9a5 5 0 0 1 10 0v3"/><path d="M12 4V2.5"/></svg>Sydney Kitchens Co.</div>
      <div class="rate"><b>4.9 &#9733;</b><span>187 Google reviews</span></div>
    </div>
  </div>
  <div class="panel">
    <div class="kicker">Kitchen renovations &middot; Sydney</div>
    <h1>Your new kitchen,<br><em>designed around you.</em></h1>
    <div class="row">
      <p class="sub">From design to the last handle, by licensed local builders. One team, one fixed price.</p>
      <span class="btn">Book a consult <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </div>
    <div class="trio"><span>Free design consult</span><span>Fixed-price quote</span><span>Licensed builders</span></div>
  </div>
</div>
</body>
</html>
