<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sydney Air Co. Ad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* Example Meta ad, 1080 x 1080. Same made-up brand, colours and logo as its
     landing page example on the site, so ad and page read as one business.
     All five ads share this layout; only the brand block at the top differs. */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --b: #0A2540; --a: #0EA5E9; --ai: #fff; --rgb: 10,37,64; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; background: var(--b); font-family: 'Inter', sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  .ad { position: relative; width: 1080px; height: 1080px; overflow: hidden; }
  .photo { position: absolute; inset: 0; background: url('../hvac-ad-img.jpg') center 45% / cover no-repeat; }
  .shade { position: absolute; inset: 0; background:
      linear-gradient(180deg, rgba(var(--rgb),.70) 0%, rgba(var(--rgb),.15) 22%, rgba(var(--rgb),0) 36%, rgba(var(--rgb),.55) 54%, rgba(var(--rgb),.93) 70%, var(--b) 100%); }

  .top { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 56px 64px; }
  .logo { display: flex; align-items: center; gap: 20px; }
  .tile { width: 84px; height: 84px; border-radius: 22px; background: var(--b); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px rgba(255,255,255,.14), 0 12px 30px rgba(0,0,0,.3); }
  .tile svg { width: 46px; height: 46px; fill: none; stroke: var(--a); stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
  .name { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 38px; letter-spacing: -.02em; line-height: 1; }
  .name small { display: block; margin-top: 8px; font-family: 'Inter', sans-serif; font-weight: 500; font-size: 19px; letter-spacing: 0; color: rgba(255,255,255,.75); }
  .rating { display: flex; align-items: center; gap: 12px; padding: 14px 22px 14px 14px; border-radius: 100px; background: #fff; color: #16181D; box-shadow: 0 12px 30px rgba(0,0,0,.25); }
  .g { width: 40px; height: 40px; border-radius: 50%; background: #F1F3F4; color: #4285F4; font: 800 24px/40px Arial, sans-serif; text-align: center; }
  .rating b { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 28px; }
  .stars { color: #FBBC04; font-size: 24px; letter-spacing: 2px; }

  .bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 64px 60px; }
  .tag { display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 100px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); font-size: 20px; font-weight: 600; margin-bottom: 26px; }
  .tag::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--a); }
  h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 100px; line-height: .98; letter-spacing: -.045em; max-width: 920px; text-wrap: balance; }
  h1 em { font-style: normal; color: var(--a); }
  .chips { display: flex; gap: 14px; margin-top: 36px; }
  .chip { flex: 1; padding: 20px 22px; border-radius: 18px; background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.18); backdrop-filter: blur(8px); }
  .chip b { display: block; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -.02em; line-height: 1.1; }
  .chip span { font-size: 20px; color: rgba(255,255,255,.75); }
  .cta-row { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-top: 32px; }
  .cta { display: inline-flex; align-items: center; gap: 14px; padding: 28px 40px; border-radius: 18px; background: var(--a); color: var(--ai); font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -.01em; box-shadow: 0 16px 36px rgba(0,0,0,.3); white-space: nowrap; }
  .cta svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .foot { font-size: 21px; color: rgba(255,255,255,.78); text-align: right; line-height: 1.45; }
</style>
</head>
<body>
<div class="ad">
  <div class="photo"></div>
  <div class="shade"></div>
  <div class="top">
    <div class="logo">
      <div class="tile"><svg viewBox="0 0 24 24"><path d="M12 2v20M3.3 7l17.4 10M20.7 7 3.3 17"/><path d="m9.5 4.5 2.5 2.5 2.5-2.5M9.5 19.5l2.5-2.5 2.5 2.5"/></svg></div>
      <div class="name">Sydney Air Co.<small>Family owned &middot; Sydney</small></div>
    </div>
    <div class="rating"><span class="g">G</span><b>4.9</b><span class="stars">&#9733;&#9733;&#9733;&#9733;&#9733;</span></div>
  </div>
  <div class="bottom">
    <div class="tag">Free in-home assessment</div>
    <h1>Ducted air, <em>zoned room by room.</em></h1>
    <div class="chips"><div class="chip"><b>14kW</b><span>Daikin ducted</span></div><div class="chip"><b>8-zone</b><span>control</span></div><div class="chip"><b>5-year</b><span>install warranty</span></div></div>
    <div class="cta-row">
      <div class="cta">Get my free quote <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
      <div class="foot">Licensed local technicians &middot; Fixed quote in 24h</div>
    </div>
  </div>
</div>
</body>
</html>
