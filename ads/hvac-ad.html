<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sydney Air Co. Ad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  /* Example Meta ad, 1080 x 1080, for the made-up Sydney Air Co. Same brand,
     colours and logo as its landing page example on the site, so ad and page
     read as one business. The look: a deep brand colour lit from within (a
     soft glow behind the headline, a warm horizon rising behind the tinted
     photo), one italic serif word in the accent colour, and the product shown
     working on floating cards. */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --base: #06142A; --base2: #0A2040; --acc: #22B8F0; --acc2: #A5E8FF; --ink: #F4F1EA; --mute: rgba(244,241,234,.7); }
  html, body { width: 1080px; height: 1080px; overflow: hidden; font-family: 'Inter', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .ad { position: relative; width: 1080px; height: 1080px; overflow: hidden;
    background: radial-gradient(60% 40% at 50% 26%, rgba(56,189,248,.16), transparent 70%), linear-gradient(180deg, var(--base) 0%, var(--base2) 55%, #0B2547 100%); }
  .photo { position: absolute; left: 0; right: 0; bottom: 0; height: 600px; background: url('../hvac-ad-img.jpg') center 80px / 1080px auto no-repeat;
    -webkit-mask: linear-gradient(180deg, transparent 15%, #000 42%); mask: linear-gradient(180deg, transparent 15%, #000 42%); filter: saturate(.55) brightness(.42) contrast(1.06) hue-rotate(-8deg); }
  .tint { position: absolute; left: 0; right: 0; bottom: 0; height: 520px; background: linear-gradient(180deg, transparent, rgba(6,20,42,.35) 55%, rgba(6,20,42,.9)); }
  .horizon { position: absolute; left: 0; right: 0; top: 0; height: 1080px; mix-blend-mode: screen; pointer-events: none; background: radial-gradient(32% 7% at 50% 83%, rgba(140,225,255,.55), transparent 70%), radial-gradient(40% 22% at 50% 100%, rgba(56,189,248,.3), transparent 72%); filter: blur(6px); }

  .air { position: absolute; inset: 0; width: 1080px; height: 1080px; mix-blend-mode: screen; pointer-events: none; }
  .top { position: absolute; left: 60px; right: 60px; top: 52px; display: flex; justify-content: space-between; align-items: center; }
  .logo { display: flex; align-items: center; gap: 14px; font-weight: 600; font-size: 28px; letter-spacing: -.01em; }
  .logo svg { width: 38px; height: 38px; fill: none; stroke: var(--acc); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .rate { padding: 11px 18px; border-radius: 18px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); text-align: right; }
  .rate b { display: block; font: 400 30px 'Instrument Serif'; line-height: 1; }
  .rate span { font-size: 14px; color: var(--mute); }

  .h { position: absolute; left: 0; right: 0; top: 180px; text-align: center; }
  h1 { font-weight: 500; font-size: 90px; line-height: 1.0; letter-spacing: -.04em; }
  h1 em { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; font-size: 106px; letter-spacing: -.01em; color: var(--acc2); }
  .sub { margin: 22px auto 0; max-width: 700px; font-size: 26px; line-height: 1.45; color: var(--mute); }
  .btn { display: inline-flex; align-items: center; gap: 12px; margin-top: 32px; font-size: 26px; font-weight: 600; padding: 20px 38px; border-radius: 100px;
    background: linear-gradient(180deg, var(--acc2), var(--acc)); color: #041826; box-shadow: 0 18px 50px -12px rgba(34,184,240,.6); }

  .cards { position: absolute; left: 60px; right: 60px; bottom: 56px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card { border-radius: 24px; padding: 22px 24px; background: rgba(255,255,255,.93); color: #14161C; box-shadow: 0 40px 80px -24px rgba(0,0,0,.7); }
  .card small { display: block; font-size: 14px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #7A7F8C; }
  .card b { display: block; font-size: 28px; font-weight: 600; margin-top: 6px; letter-spacing: -.02em; }
  .card span { font-size: 16px; color: #7A7F8C; }
  .row { display: flex; align-items: center; justify-content: space-between; }
  .ring { width: 78px; height: 78px; border-radius: 50%; background: conic-gradient(var(--acc) 0 82%, #EEE9DF 82% 100%); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .ring i { width: 60px; height: 60px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font: 600 20px 'Inter'; font-style: normal; }
  .pill { font-size: 14px; font-weight: 700; letter-spacing: .06em; padding: 6px 12px; border-radius: 100px; background: #E8F7EF; color: #178A50; }
</style>
</head>
<body>
<div class="ad">
  <div class="photo"></div><div class="tint"></div><div class="horizon"></div>
  <svg class="air" viewBox="0 0 1080 1080" aria-hidden="true"><defs><linearGradient id="airfall" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#BDEFFF" stop-opacity=".75"/><stop offset=".35" stop-color="#5CC8F5" stop-opacity=".32"/><stop offset="1" stop-color="#22B8F0" stop-opacity="0"/></linearGradient><filter id="airsoft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22"/></filter><filter id="airtight"><feGaussianBlur stdDeviation="4"/></filter></defs>
    <path d="M250,872 L825,920 L990,1100 L110,1100 Z" fill="url(#airfall)" filter="url(#airsoft)"/>
    <path d="M254,868 L822,918" fill="none" stroke="#C8F2FF" stroke-width="6" stroke-linecap="round" filter="url(#airtight)" opacity=".9"/>
  </svg>
  <div class="top">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 3v18M4.5 7.5l15 9M19.5 7.5l-15 9"/></svg>Sydney Air Co.</div>
    <div class="rate"><b>4.9 &#9733;</b><span>212 Google reviews</span></div>
  </div>
  <div class="h">
    <h1>Beat the heat,<br><em>room by room.</em></h1>
    <p class="sub">Ducted and split systems, sized for your home and installed by licensed local technicians.</p>
    <span class="btn">Get my free quote</span>
  </div>
</div>
</body>
</html>
