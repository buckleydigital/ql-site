<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sydney Bathrooms Co. Ad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  /* Example Meta ad, 1080 x 1080, for the made-up Sydney Bathrooms Co. A
     three-colour scheme: Espresso (the deep warm base), Travertine (the warm
     ivory neutral) and Brass (the accent). The bathroom is dimmed so its own
     lights carry the glow: the backlit mirror and the shower niche, lifted in
     brass. Below it, an editorial travertine panel with espresso type and one
     italic brass phrase. */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --espresso: #1C1714; --espresso2: #2A221D; --travertine: #F1E9DC; --brass: #B8904F; --brass-lt: #E6C891; --brass-dk: #8C6A34; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
  .ad { position: relative; width: 1080px; height: 1080px; overflow: hidden; background: var(--espresso); }

  /* the room, at dusk, with its own lights on */
  .room { position: absolute; left: 0; right: 0; top: 0; height: 650px; overflow: hidden; }
  .photo { position: absolute; inset: 0; background: url('../renovation-ad-img.jpg') center -25px / 1080px auto no-repeat; filter: saturate(.8) brightness(.52) contrast(1.1) sepia(.26); }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(28,23,20,.78) 0%, rgba(28,23,20,.1) 24%, rgba(28,23,20,0) 62%, rgba(28,23,20,.75) 100%); }
  .lights { position: absolute; inset: 0; width: 1080px; height: 660px; mix-blend-mode: screen; pointer-events: none; }

  .top { position: absolute; left: 56px; right: 56px; top: 48px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
  .logo { display: flex; align-items: center; gap: 14px; font-weight: 600; font-size: 27px; color: var(--travertine); letter-spacing: -.01em; }
  .logo svg { width: 36px; height: 36px; fill: none; stroke: var(--brass-lt); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .rate { padding: 10px 18px; border-radius: 18px; background: rgba(241,233,220,.1); border: 1px solid rgba(241,233,220,.22); backdrop-filter: blur(8px); text-align: right; color: var(--travertine); }
  .rate b { display: block; font: 400 30px 'Instrument Serif'; line-height: 1; }
  .rate span { font-size: 14px; color: rgba(241,233,220,.72); }

  /* the travertine panel */
  .panel { position: absolute; left: 0; right: 0; bottom: 0; height: 440px; background: linear-gradient(180deg, #F5EEE3 0%, var(--travertine) 100%); padding: 40px 60px 0; }
  .panel::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--brass) 20%, var(--brass-lt) 50%, var(--brass) 80%, transparent); }
  .kicker { display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--brass-dk); }
  .kicker::before { content: ''; width: 34px; height: 1.5px; background: var(--brass); }
  h1 { margin-top: 16px; font-weight: 500; font-size: 74px; line-height: 1.0; letter-spacing: -.04em; color: var(--espresso); }
  h1 em { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; font-size: 86px; letter-spacing: -.01em; color: var(--brass-dk); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 28px; margin-top: 24px; }
  .sub { font-size: 22px; line-height: 1.45; color: #5E5249; max-width: 520px; }
  .btn { display: inline-flex; align-items: center; gap: 12px; flex-shrink: 0; padding: 20px 32px; border-radius: 100px; background: var(--espresso); color: var(--travertine); font-size: 22px; font-weight: 600; box-shadow: 0 16px 34px -14px rgba(28,23,20,.6); }
  .trio { position: absolute; left: 60px; right: 60px; bottom: 34px; display: flex; gap: 30px; padding-top: 18px; border-top: 1px solid rgba(140,106,52,.25); font-size: 16px; font-weight: 500; letter-spacing: .02em; color: #6E6056; }
  .trio span { display: inline-flex; align-items: center; gap: 10px; }
  .trio span::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--brass); }
  .btn svg { width: 22px; height: 22px; fill: none; stroke: var(--brass-lt); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="ad">
  <div class="room">
    <div class="photo"></div><div class="shade"></div>
    <svg class="lights" viewBox="0 0 1080 660" aria-hidden="true"><defs>
      <filter id="halo-wide" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
      <filter id="halo-tight" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter></defs>
      <ellipse cx="410" cy="330" rx="178" ry="172" fill="none" stroke="#F0CF92" stroke-width="54" filter="url(#halo-wide)" opacity=".55"/>
      <ellipse cx="410" cy="330" rx="176" ry="170" fill="none" stroke="#FFE2AE" stroke-width="9" filter="url(#halo-tight)" opacity=".95"/>
      <rect x="664" y="326" width="186" height="14" rx="7" fill="#F5D7A0" filter="url(#halo-tight)" opacity=".85"/>
      <rect x="650" y="300" width="214" height="70" rx="30" fill="#E8C185" filter="url(#halo-wide)" opacity=".45"/>
    </svg>
    <div class="top">
      <div class="logo"><svg viewBox="0 0 24 24"><path d="M4 12h16v3a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/><path d="M6 12V5a2 2 0 0 1 2-2h1"/><path d="M7 19l-1 2M17 19l1 2"/></svg>Sydney Bathrooms Co.</div>
      <div class="rate"><b>4.9 &#9733;</b><span>212 Google reviews</span></div>
    </div>
  </div>
  <div class="panel">
    <div class="kicker">Bathroom renovations &middot; Sydney</div>
    <h1>Your new bathroom,<br><em>in weeks, not months.</em></h1>
    <div class="row">
      <p class="sub">From design to the last tile, by licensed local builders. One team, one fixed price.</p>
      <span class="btn">Book a consult <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </div>
    <div class="trio"><span>Free design consult</span><span>Fixed-price quote</span><span>Licensed builders</span></div>
  </div>
</div>
</body>
</html>
